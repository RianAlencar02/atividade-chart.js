<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Chart.js</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <h1 style="text-align: center;">Dashboard</h1>

    <div style="display: flex; justify-content: center;">
        <div style="position: relative; height: 40vh; width: 80vh;">
            <canvas id="graficoLinhas"></canvas>
        </div>

        <div style="position: relative; height: 40vh; width: 80vh;">
            <canvas id="graficoBarras"></canvas>
        </div>
    </div>

</body>

</html>
<script>
  const ctxLinhas = document.getElementById('graficoLinhas');

  new Chart(ctxLinhas, {
    type: 'line',
    data: {
      labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
      datasets: [{
        label: 'Temperatura',
        backgroundColor: 'rgb(255, 95, 125)',
        borderColor: 'rgb(255, 95, 125)',
        data: [30, 29, 28, 25, 22, 23],
        borderWidth: 5
      },
      {
        label: 'Umidade',
        backgroundColor: 'rgb(0,168,255)',
        borderColor: 'rgb(0,168,255)',
        data: [80, 82, 80, 85, 80, 83],
        borderWidth: 5
      }
      ]
    },
    options: {
      scales: {
        y: {
          beginAtZero: false
        }
      }
    }
  });

  const ctxBarras = document.getElementById('graficoBarras');

  new Chart(ctxBarras, {
    type: 'bar',
    data: {
      labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
      datasets: [{
        label: 'Temperatura Média',
        backgroundColor: 'rgb(255, 95, 125)',
        borderColor: 'rgb(255, 95, 125)',
        data: [22, 24, 27, 23, 20, 18],
        borderWidth: 1
      },
      {
        label: 'Umidade Média',
        data: [90, 89, 93, 87, 88, 82],
        backgroundColor: 'rgb(0,168,255)',
        borderColor: 'rgb(0,168,255)',
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

</script>
